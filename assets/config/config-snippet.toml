# --- grok-vibe-stack managed block (begin) ---
# MAX quality gates + MAX token savings (interactive session)
[session]
# Compact earlier than default 70 - shrinks long sessions harder
auto_compact_threshold_percent = 55

[features]
two_pass_compaction = true

[mcp]
# Cap fat tool dumps entering context (was 40000)
max_output_bytes = 20000

# Headroom MCP (headroom__* tools) is ON by default. Optional off:
# set enabled = false (tool defs cost tokens every turn). Proxy + RTK stay on.
[mcp_servers.headroom]
command = "HEADROOM_MCP_CMD"
args = []
enabled = true
startup_timeout_sec = 90

[mcp_servers.serena]
command = "SERENA_EXE"
args = [
    "start-mcp-server",
    "--project-from-cwd",
    "--context=grok",
    "--open-web-dashboard",
    "false",
]
enabled = true
startup_timeout_sec = 120

# Quote dotted ids. Unquoted [model.grok-4.6] is parsed as model.grok-4 + field "6"
# (Grok 1.0.3 inspect: unknown-field) so the table never registers.
# Catalog default is grok-4.6 (beats [models].default). Override so default hits Headroom.
# Do NOT set env_key. Grok then uses auth.json like grok-4.6-direct.
# env_key = XAI_API_KEY makes the TUI wait forever when that env is unset.
[model."grok-4.6"]
base_url = "http://127.0.0.1:8787/v1"
api_backend = "responses"
name = "Grok 4.6 + Headroom proxy (max savings)"
description = "Grok 4.6 via local Headroom proxy port 8787 - max token compression profile"

# One Headroom. Dual :8788 starved/killed the chat proxy and hatched gates to direct.
# grok-gate is an alias of :8787. Gates run sequential on this proxy.
[model."grok-gate"]
model = "grok-4.6"
base_url = "http://127.0.0.1:8787/v1"
api_backend = "responses"
name = "Grok 4.6 + Headroom (gate alias)"
description = "Same Headroom as grok-4.6 (:8787). One proxy. Gates sequential."
context_window = 500000

# Explicit alias (older sessions / start-grok -m grok-via-headroom)
[model.grok-via-headroom]
model = "grok-4.6"
base_url = "http://127.0.0.1:8787/v1"
api_backend = "responses"
name = "Grok 4.6 + Headroom proxy (alias)"
description = "Same Headroom proxy as the grok-4.6 override; kept for -m grok-via-headroom"
context_window = 500000

# Vanilla hatch (no proxy). Quoted table is required; -m grok-4.6-direct is honored.
# model= is the API id only; this table keeps its own official base_url.
[model."grok-4.6-direct"]
model = "grok-4.6"
base_url = "https://cli-chat-proxy.grok.com/v1"
api_backend = "responses"
name = "Grok 4.6 (direct, no Headroom)"
description = "Official Grok 4.6, bypasses local Headroom proxy"
context_window = 500000

[models]
default = "grok-4.6"
# medium for interactive chat savings; commit/push AI review forces high via grok-ai-review.ps1
default_reasoning_effort = "medium"
# --- grok-vibe-stack managed block (end) ---
